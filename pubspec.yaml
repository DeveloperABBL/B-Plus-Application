name: brownyplus
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  retrofit: ^4.9.2
  flutter_svg: ^2.0.17
  material: ^1.0.1
  dotted_line: ^3.2.2
  flutter_screenutil: ^5.9.3
  provider: ^6.1.5+1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.13.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - env/dev.json
    - assets/png/
    - assets/svg/
    - assets/images/BrownyPlusLogo.png
    - assets/images/banner/
    - assets/images/clock/
    - assets/images/home_menu/
    - assets/images/order/

flutter_gen:
  output: lib/res/icons/
  line_length: 80
